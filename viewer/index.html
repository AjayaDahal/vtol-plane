<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VTOL plane — 3D viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f4; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: absolute; top: 8px; left: 8px; z-index: 2; background: #ffffffeb; border-radius: 8px; padding: 8px 10px;
        box-shadow: 0 1px 4px #0003; max-width: 360px; max-height: calc(100% - 56px); overflow-y: auto; }
  #ui h1 { font-size: 14px; margin: 0 0 6px; cursor: pointer; user-select: none; }
  #ui h1::after { content: " \25BE"; color: #888; }
  #ui.min h1 { margin: 0; }
  #ui.min h1::after { content: " \25B8  (show controls)"; font-weight: normal; font-size: 12px; }
  #ui.min .row { display: none; }
  #ui button { margin: 2px 2px 2px 0; padding: 3px 7px; font-size: 12px; cursor: pointer; }
  #ui button.big { font-weight: 600; }
  #ui label { display: inline-block; margin: 3px 8px 3px 0; }
  #ui select { font-size: 12px; max-width: 250px; }
  #ui .row { margin: 4px 0; }
  #ui .hd { font-weight: 600; margin-top: 8px; padding-top: 6px; border-top: 1px solid #dde2e8; }
  #ui .note { color: #666; font-size: 12px; }
  #ui input[type=range] { vertical-align: middle; width: 130px; }
  #status { position: absolute; bottom: 8px; left: 8px; color: #555; z-index: 2; }
  #legend { position: absolute; bottom: 8px; right: 8px; background: #ffffffe6; border-radius: 8px; padding: 6px 10px; z-index: 2; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin: 0 4px 0 10px; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
  #tip { position: absolute; pointer-events: none; background: #1f2630ee; color: #fff; padding: 4px 8px; border-radius: 4px;
         font-size: 12px; display: none; white-space: pre; z-index: 3; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui">
  <h1>VTOL plane v0.2</h1>
  <div class="row aircraft">
    <button data-view="iso_front">3/4 front</button><button data-view="iso_rear">3/4 rear</button>
    <button data-view="front">Front</button><button data-view="rear">Rear</button>
    <button data-view="left">Left</button><button data-view="right">Right</button>
    <button data-view="top">Top</button><button data-view="bottom">Bottom</button>
  </div>
  <div class="row aircraft">
    Wing: <button data-view="wing_top">top</button><button data-view="wing_le">leading edge</button>
    <button data-view="wing_span">sight down span</button><button data-view="wing_under">underside</button><br>
    Joints: <button data-view="joint_root">root</button><button data-view="joint_boom">boom rib</button>
    <button data-view="joint_midtip">mid/tip</button><button data-view="joint_tip">tip</button>
  </div>
  <div class="row aircraft">
    Colours:
    <label><input type="radio" name="mode" value="printed" checked> as printed</label>
    <label><input type="radio" name="mode" value="paint"> one colour</label>
    <label><input type="radio" name="mode" value="zebra"> reflection stripes</label>
    <label><input type="radio" name="mode" value="parts"> by part</label>
  </div>
  <div class="row aircraft">
    <label><input type="checkbox" id="xray"> x-ray skins</label>
    <label><input type="checkbox" id="extras" checked> motors, props, carbon</label>
    <label><input type="checkbox" id="graze"> grazing light</label>
  </div>
  <div class="row aircraft">Tilt <input type="range" id="tilt" min="-20" max="90" value="0"> <span id="tiltv">0°</span>
    (0 = hover, 90 = forward flight)</div>
  <div class="row hd aircraft">Burst view and inside</div>
  <div class="row aircraft">
    <button id="burst" class="big">Burst ▸</button>
    <input type="range" id="explode" min="0" max="100" value="0"> <span id="explodev">0 %</span>
  </div>
  <div class="row aircraft"><button id="nose">Open the nose, slide the battery out</button></div>
  <div class="row aircraft"><button id="service">Service: open the servo hatches, lift the yokes off</button></div>
  <div class="row aircraft">
    <label><input type="checkbox" id="equip" checked> equipment</label>
    <label><input type="checkbox" id="cables" checked> cables</label>
    <label><input type="checkbox" id="labels" checked> labels</label>
  </div>
  <div class="row aircraft">Cut:
    <select id="section">
      <option value="none">no cut</option>
      <option value="y0">along the centreline (y = 0)</option>
      <option value="x280">across the battery's front strap (x = 280)</option>
      <option value="x305">across the Pixhawk (x = 305)</option>
      <option value="x385">across the ESC block (x = 385)</option>
      <option value="wing">across the right wing root bay (y = 170)</option>
      <option value="hatch">through the right mid aileron hatch (y = 325)</option>
    </select>
  </div>
  <div class="row hd">Printable parts</div>
  <div class="row">
    <button id="gallery" class="big">Show the print files</button>
    <button id="back" class="big" style="display:none">Back to the aircraft</button>
    <select id="gfilter">
      <option value="all">all print files</option>
      <option value="s1_plates">Kobra S1, PETG plates</option>
      <option value="s1_lwpla">Kobra S1, LW-PLA (right wing)</option>
      <option value="x_lwpla">Kobra X, LW-PLA (left wing, fuselage, V-tail)</option>
      <option value="s1_petg">Kobra S1, PETG one part per file (reprints)</option>
    </select>
  </div>
  <div class="row note">Hover a part for its name; double-click to zoom to it.</div>
</div>
<canvas id="overlay"></canvas>
<div id="tip"></div>
<div id="legend"></div>
<div id="status">loading…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const params = new URLSearchParams(location.search);
const capture = params.has('capture');
const $ = id => document.getElementById(id);
const status = $('status');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(capture ? 1 : window.devicePixelRatio);
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const overlay = $('overlay'), octx = overlay.getContext('2d');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
const camera = new THREE.PerspectiveCamera(30, 1, 5, 20000);
camera.up.set(0, 0, 1);
let controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
const fill = new THREE.DirectionalLight(0xffffff, 0.6);
scene.add(key, key.target, fill, fill.target);
function setLights(graze) {
  key.position.set(...(graze ? [-300, 900, 120] : [-500, -700, 900]));
  fill.position.set(700, 500, 300);
}
setLights(false);
const grid = new THREE.GridHelper(2400, 48, 0xb9c0c8, 0xd5dae0);
grid.rotation.x = Math.PI / 2; grid.position.set(550, 0, -75); scene.add(grid);

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const V3 = a => new THREE.Vector3(a[0], a[1], a[2]);
const COL = { lwpla: 0xeae6da, petg: 0x2f6db5, carbon: 0x1b1b1b, motor: 0x3b3b3b, bell: 0xb03030, prop: 0x9aa3ad, paint: 0xd8dbdf };

// Section cuts: every aircraft material shares one clipping plane. Faces seen from behind are
// drawn darker, so a cut shell reads as the inside of a shell.
const clipPlane = new THREE.Plane(V(0, -1, 0), 0);
const clipMats = new Set();
let sectionOn = false;
const tintBack = s => {
  s.fragmentShader = s.fragmentShader.replace('#include <color_fragment>',
    '#include <color_fragment>\n\tif ( ! gl_FrontFacing ) diffuseColor.rgb *= 0.55;');
};
function prep(m) {
  m.side = THREE.DoubleSide;
  m.onBeforeCompile = tintBack;
  clipMats.add(m);
  m.clippingPlanes = sectionOn ? [clipPlane] : null;
  return m;
}
const std = o => prep(new THREE.MeshStandardMaterial(o));
const mats = {
  lwpla: std({ color: COL.lwpla, roughness: 0.85, metalness: 0 }),
  petg: std({ color: COL.petg, roughness: 0.45, metalness: 0 }),
  carbon: std({ color: COL.carbon, roughness: 0.35, metalness: 0.2 }),
  motor: std({ color: COL.motor, roughness: 0.4, metalness: 0.6 }),
  bell: std({ color: COL.bell, roughness: 0.4, metalness: 0.5 }),
  prop: std({ color: COL.prop, roughness: 0.6, transparent: true, opacity: 0.28, depthWrite: false }),
};

// Reflection stripes (the "zebra" surface check): a striped light box reflected in a glossy
// finish. Stripes that run on unbroken across a joint mean the surfaces meet without a kink.
const zebraMat = new THREE.ShaderMaterial({
  uniforms: { freq: { value: 9.0 } },
  clipping: true,
  vertexShader: `
    #include <clipping_planes_pars_vertex>
    varying vec3 vN; varying vec3 vW;
    void main() {
      vec4 w = modelMatrix * vec4(position, 1.0);
      vW = w.xyz;
      vN = mat3(modelMatrix) * normal;
      vec4 mvPosition = viewMatrix * w;
      #include <clipping_planes_vertex>
      gl_Position = projectionMatrix * mvPosition;
    }`,
  fragmentShader: `
    #include <clipping_planes_pars_fragment>
    uniform float freq;
    varying vec3 vN; varying vec3 vW;
    void main() {
      #include <clipping_planes_fragment>
      vec3 n = normalize(vN);
      vec3 v = normalize(vW - cameraPosition);
      vec3 r = reflect(v, n);
      float a = atan(r.x, r.z) / 6.2831853;
      float s = smoothstep(0.42, 0.58, abs(fract(freq * a) - 0.5) * 2.0);
      float shade = 0.75 + 0.25 * abs(dot(n, v));
      gl_FragColor = vec4(vec3(mix(0.10, 0.97, s) * shade), 1.0);
    }`,
});
clipMats.add(zebraMat);

const man = await (await fetch('manifest.json')).json();
const loader = new STLLoader();
// A local server can drop a request when dozens arrive at once: retry before giving up.
async function loadSTL(url, tries = 4) {
  for (let k = 1; ; k++) {
    try { return await loader.loadAsync(url); }
    catch (e) { if (k >= tries) throw e; await new Promise(r => setTimeout(r, 400 * k)); }
  }
}
const parts = [], extras = [], movers = [], equip = [], cables = [], pivots = {};
const root = new THREE.Group(); scene.add(root);

// Everything that moves in the burst view, when the nose opens or in the service view: base
// position, burst offset, and offsets that play within a stage of the nose or service animation.
function mover(o, ex, name) {
  o.userData.base = o.position.clone();
  o.userData.ex = ex ? V3(ex) : V(0, 0, 0);
  const nose = man.nose[name], svc = (man.service || {})[name];
  if (nose) o.userData.nose = { v: V3(nose.v), stage: nose.stage };
  if (svc) o.userData.svc = { v: V3(svc.v), stage: svc.stage };
  movers.push(o);
  return o;
}
function pivotFor(side, at) {
  if (!pivots[side]) {
    const p = new THREE.Group(); p.position.set(...at); p.userData.name = 'pivot_' + side;
    root.add(p); pivots[side] = p;
  }
  return pivots[side];
}

// Smooth normals that do not cross edges sharper than `angle`, weighted by face area and
// computed over all parts at once. Where a skin meets its rib flange the two meshes share the
// seam's vertices, so the glued surface shades as one piece rather than part by part.
function creasedNormals(geos, angle) {
  const cosA = Math.cos(angle), ids = new Map(), vid = [];
  const key = (p, v) => `${Math.round(p.getX(v) * 100)},${Math.round(p.getY(v) * 100)},${Math.round(p.getZ(v) * 100)}`;
  let nf = 0;
  for (const g of geos) {
    const pos = g.attributes.position, a = new Uint32Array(pos.count);
    for (let v = 0; v < pos.count; v++) {
      const k = key(pos, v);
      let id = ids.get(k);
      if (id === undefined) ids.set(k, id = ids.size);
      a[v] = id;
    }
    vid.push(a);
    nf += g.index.count / 3;
  }
  const w = new Float32Array(nf * 3), u = new Float32Array(nf * 3), start = new Uint32Array(ids.size + 1);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  let F = 0;
  geos.forEach((g, gi) => {
    const pos = g.attributes.position, idx = g.index.array;
    for (let f = 0; f < idx.length / 3; f++, F++) {
      a.fromBufferAttribute(pos, idx[3 * f]); b.fromBufferAttribute(pos, idx[3 * f + 1]);
      c.fromBufferAttribute(pos, idx[3 * f + 2]);
      c.sub(b).cross(a.sub(b));                      // length = twice the face area
      const l = c.length() || 1;
      w.set([c.x, c.y, c.z], 3 * F);
      u.set([c.x / l, c.y / l, c.z / l], 3 * F);
      for (let k = 0; k < 3; k++) start[vid[gi][idx[3 * f + k]] + 1]++;
    }
  });
  for (let v = 0; v < ids.size; v++) start[v + 1] += start[v];
  const fill = start.slice(0, ids.size), faces = new Uint32Array(start[ids.size]);
  F = 0;
  geos.forEach((g, gi) => {
    const idx = g.index.array;
    for (let f = 0; f < idx.length / 3; f++, F++)
      for (let k = 0; k < 3; k++) faces[fill[vid[gi][idx[3 * f + k]]]++] = F;
  });
  F = 0;
  return geos.map((g, gi) => {
    const pos = g.attributes.position, idx = g.index.array, n = idx.length / 3;
    const outP = new Float32Array(n * 9), outN = new Float32Array(n * 9);
    for (let f = 0; f < n; f++, F++) for (let k = 0; k < 3; k++) {
      const v = idx[3 * f + k], gv = vid[gi][v], o = 9 * f + 3 * k;
      let x = 0, y = 0, z = 0;
      for (let j = start[gv]; j < start[gv + 1]; j++) {
        const h = faces[j];
        if (u[3 * F] * u[3 * h] + u[3 * F + 1] * u[3 * h + 1] + u[3 * F + 2] * u[3 * h + 2] > cosA) {
          x += w[3 * h]; y += w[3 * h + 1]; z += w[3 * h + 2];
        }
      }
      const l = Math.hypot(x, y, z) || 1;
      outN[o] = x / l; outN[o + 1] = y / l; outN[o + 2] = z / l;
      outP[o] = pos.getX(v); outP[o + 1] = pos.getY(v); outP[o + 2] = pos.getZ(v);
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(outP, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(outN, 3));
    return out;
  });
}

let n = 0;
const raw = await Promise.all(man.parts.map(async p => {
  const g = await loadSTL(p.url);
  g.deleteAttribute('normal');
  status.textContent = `loading ${++n}/${man.parts.length}`;
  return BGU.mergeVertices(g, 1e-3);
}));
status.textContent = 'smoothing…';
creasedNormals(raw, THREE.MathUtils.degToRad(35)).forEach((g, i) => {
  const p = man.parts[i];
  const m = new THREE.Mesh(g, mats[p.material]);
  m.userData = { ...p, kind: 'part', hue: (i * 0.618) % 1 };
  if (p.tilt) {
    const mot = man.motors.find(o => o.name === 'motor_' + p.side);
    const piv = pivotFor(p.side, mot.pivot);
    m.position.set(-mot.pivot[0], -mot.pivot[1], -mot.pivot[2]);
    piv.add(m);
  } else {
    root.add(m);
    mover(m, p.burst, p.name);
  }
  parts.push(m);
});

// The loose hatch parts (a cover and two blocks per servo hatch), placed where they fit.
const instGeo = {};
for (const i of man.instances || []) {
  if (!instGeo[i.url]) {
    const g = await loadSTL(i.url);
    instGeo[i.url] = BGU.toCreasedNormals(g, THREE.MathUtils.degToRad(30));
  }
  const m = new THREE.Mesh(instGeo[i.url], mats[i.material]);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V3(i.basis[0]), V3(i.basis[1]), V3(i.basis[2])));
  m.position.set(...i.origin);
  m.userData = { name: i.name, kind: 'part', material: i.material, group: 'structure', role: i.role, printer: 's1',
                 hue: (parts.length * 0.618) % 1 };
  root.add(m);
  mover(m, i.burst, i.name);
  parts.push(m);
}

function tubeMesh(t) {
  const a = V3(t.a), b = V3(t.b);
  const geo = new THREE.CylinderGeometry(t.od / 2, t.od / 2, a.distanceTo(b), 32, 1, false);
  const m = new THREE.Mesh(geo, mats.carbon);
  m.position.copy(a.clone().add(b).multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize());
  return m;
}
for (const t of man.tubes) {
  const m = tubeMesh(t);
  m.userData = { name: t.name, kind: 'tube' };
  root.add(m); extras.push(m); mover(m, t.burst, t.name);
}
for (const mo of man.motors) {
  const grp = new THREE.Group();
  const stator = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 6, 40), mats.motor);
  stator.rotation.x = Math.PI / 2; stator.position.z = 3;
  const bell = new THREE.Mesh(new THREE.CylinderGeometry(17, 17, 24, 40), mats.bell);
  bell.rotation.x = Math.PI / 2; bell.position.z = 6 + 12;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, mo.prop_z - 30 + 4, 16), mats.motor);
  shaft.rotation.x = Math.PI / 2; shaft.position.z = 30 + (mo.prop_z - 30) / 2;
  const prop = new THREE.Mesh(new THREE.CircleGeometry(man.prop_d / 2, 64), mats.prop);
  prop.position.z = mo.prop_z;
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 7, 24), mats.motor);
  hub.rotation.x = Math.PI / 2; hub.position.z = mo.prop_z;
  grp.add(stator, bell, shaft, prop, hub);
  grp.userData = { name: mo.name, kind: 'motor' };
  if (mo.tilt) {
    const piv = pivotFor(mo.name.slice(-1), mo.pivot);
    grp.position.set(mo.base[0] - mo.pivot[0], mo.base[1] - mo.pivot[1], mo.base[2] - mo.pivot[2]);
    piv.add(grp);
    mover(grp, mo.burst_local, mo.name);              // along the thrust axis, whatever the tilt
    if (!piv.userData.base) mover(piv, mo.burst_pivot, piv.userData.name);
  } else {
    grp.position.set(...mo.base); root.add(grp); mover(grp, mo.burst, mo.name);
  }
  extras.push(grp);
}

// Purchased equipment (scripts/payload.py) as simple envelopes, and a sketch of the cable runs.
const eqGroup = new THREE.Group(); root.add(eqGroup);
const edgeMat = new THREE.LineBasicMaterial({ color: 0x1b1f24, transparent: true, opacity: 0.45 });
clipMats.add(edgeMat);
for (const e of man.equipment) {
  // Drawn 0.2 mm inside their envelopes, so faces resting on a part don't flicker against it.
  const geo = e.kind === 'box' ? new THREE.BoxGeometry(e.size[0] - 0.4, e.size[1] - 0.4, e.size[2] - 0.4)
                               : new THREE.CylinderGeometry(e.r - 0.2, e.r - 0.2, e.h - 0.4, 48);
  const m = new THREE.Mesh(geo, std({ color: new THREE.Color(e.color), roughness: 0.55, metalness: 0.05 }));
  if (e.kind === 'cyl') m.quaternion.setFromUnitVectors(V(0, 1, 0), V3(e.axis).normalize());
  if (e.basis) m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V3(e.basis[0]), V3(e.basis[1]), V3(e.basis[2])));
  m.position.set(e.pos[0], e.pos[1], e.pos[2]);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), edgeMat));
  m.userData = { ...e, kind: 'equip' };
  eqGroup.add(m); equip.push(m);
  mover(m, e.burst, e.name);
}
const cabGroup = new THREE.Group(); root.add(cabGroup);
let cablesOn = true;
for (const r of man.routes) {
  const curve = new THREE.CatmullRomCurve3(r.pts.map(V3), false, 'centripetal');
  const geo = new THREE.TubeGeometry(curve, Math.max(40, r.pts.length * 24), r.d / 2, 10, false);
  const m = new THREE.Mesh(geo, std({ color: new THREE.Color(r.color), roughness: 0.6 }));
  m.userData = { name: r.name, kind: 'cable' };
  cabGroup.add(m); cables.push(m);
}

// ---- appearance ---------------------------------------------------------
let mode = 'printed', xray = false;
const partMats = new Map();
function applyLook() {
  for (const m of parts) {
    const p = m.userData;
    let mat;
    if (mode === 'paint') {
      if (!partMats.has('paint')) partMats.set('paint', std({ color: COL.paint, roughness: 0.55 }));
      mat = partMats.get('paint');
    } else if (mode === 'zebra') mat = zebraMat;
    else if (mode === 'parts') {
      if (!partMats.has(p.name)) partMats.set(p.name, std({ color: new THREE.Color().setHSL(p.hue, 0.55, 0.62), roughness: 0.6 }));
      mat = partMats.get(p.name);
    } else mat = mats[p.material];
    if (xray && p.group === 'skin' && mode !== 'zebra') {
      const k = 'x_' + mat.uuid;
      if (!partMats.has(k)) {
        const c = prep(mat.clone());
        c.transparent = true; c.opacity = 0.14; c.depthWrite = false;
        partMats.set(k, c);
      }
      mat = partMats.get(k);
    }
    m.material = mat;
  }
}
function setTilt(deg) {
  for (const p of Object.values(pivots)) p.rotation.y = -THREE.MathUtils.degToRad(deg);
  $('tiltv').textContent = `${deg}°`;
  $('tilt').value = deg;
}

// ---- burst view, nose and service animations ------------------------------------
const anim = { b: 0, bTo: 0, n: 0, nTo: 0, s: 0, sTo: 0 };
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const stage = (t, s) => ease(Math.min(1, Math.max(0, (t - s[0]) / (s[1] - s[0]))));
const approach = (a, b, d) => a < b ? Math.min(b, a + d) : Math.max(b, a - d);
function pose() {

        m.position.set(cx - q.bed / 2 + it.x, cy - q.bed / 2 + it.y, 0);
        m.rotation.z = THREE.MathUtils.degToRad(it.angle);
        m.userData = { kind: 'platepart', name: it.part, copy: it.copy, copies: per[it.part], plate: q.name,
                       grams: p.grams, role: p.role };
        sub.add(m); galleryItems.push(m);
      }
      grams += q.grams || 0; minutes += q.minutes || 0; copies += n;
    });
    sub.userData = { key: 's1_plates', rows: Math.ceil(man.plates.length / cols),
                     title: `Kobra S1 · PETG plates: ${man.plates.length} plates, ${copies} prints, ${Math.round(grams)} g, ${fmtMin(minutes)}` };
    grp.add(sub);
  }
  for (const [pr, mt, title] of GROUPS) {
    const sub = new THREE.Group();
    const items = man.prints.map((p, i) => [p, geos[i]]).filter(([p]) => p.printer === pr && p.material === mt);
    let grams = 0, minutes = 0, copies = 0;
    items.forEach(([p, g], i) => {
      const cx = (i % COLS) * PITCH_X, cy = -Math.floor(i / COLS) * PITCH_Y;
      bedAt(sub, cx, cy, p.bed);
      const m = new THREE.Mesh(g, gm[p.material]); m.position.set(cx, cy, 0);
      m.userData = { ...p, kind: 'print', anchor: V(cx, cy - p.bed / 2 - 2, 0),
                     label: `${p.name}${p.qty > 1 ? ' ×' + p.qty : ''}\n${p.grams != null ? p.grams.toFixed(1) + ' g · ' : ''}${fmtMin(p.minutes)}` };
      sub.add(m); galleryItems.push(m);
      grams += (p.grams || 0) * p.qty; minutes += (p.minutes || 0) * p.qty; copies += p.qty;
    });
    sub.userData = { key: `${pr}_${mt}`, rows: Math.ceil(items.length / COLS),
                     title: `${title}: ${items.length} files, ${copies} prints, ${Math.round(grams)} g, ${fmtMin(minutes)}` };
    grp.add(sub);
  }
  gallery = grp;
  layoutGallery();
  status.textContent = `${man.prints.length} print files and ${(man.plates || []).length} PETG plates on their beds — hover one for its mass and print time, double-click to zoom`;
  if (!capture) setTimeout(() => { status.textContent = ''; }, 9000);
}
function layoutGallery() {
  let y = 0;
  for (const sub of gallery.children) {
    sub.visible = galleryFilter === 'all' || galleryFilter === sub.userData.key;
    if (!sub.visible) continue;
    sub.position.set(0, y, 0);
    y -= sub.userData.rows * PITCH_Y + 220;
  }
}
async function showGallery(on) {
  if (on && !gallery) await buildGallery();
  galleryOn = on;
  if (gallery) {
    gallery.visible = on;
    if (on) layoutGallery();   // the filter may have changed while the aircraft was shown
  }
  root.visible = !on;
  $('back').style.display = on ? '' : 'none';
  $('gallery').style.display = on ? 'none' : '';
  document.querySelectorAll('#ui .aircraft').forEach(el => el.style.display = on ? 'none' : '');
  tip.style.display = 'none';
  if (!on) status.textContent = '';
  updateLegend();
  frameView(on ? 'gallery' : 'iso_front', camera.aspect);
}
function updateLegend() {
  const sw = (c, t) => `<span class="sw" style="background:${c}"></span>${t}`;
  $('legend').innerHTML = galleryOn
    ? sw('#eae6da', 'LW-PLA (vase)') + sw('#2f6db5', 'PETG') + sw('#dde2e7', 'bed: S1 250 mm, X 260 mm')
    : sw('#eae6da', 'LW-PLA skins') + sw('#2f6db5', 'PETG') + sw('#1b1b1b', 'carbon') +
      (eqGroup.visible ? sw('#e8b923', 'battery') + sw('#7a3fb0', 'ESCs') + sw('#3a7d44', 'avionics') : '');
}

// ---- page wiring and render loop ------------------------------------------------
function resize() {
  const w = capture ? 1600 : innerWidth, h = capture ? 1000 : innerHeight;
  renderer.setSize(w, h, !capture);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const dpr = capture ? 1 : devicePixelRatio;
  overlay.width = Math.round(w * dpr); overlay.height = Math.round(h * dpr);
  overlay.style.width = `${w}px`; overlay.style.height = `${h}px`;
}
addEventListener('resize', resize);
resize();
applyLook();
pose();
syncUI();
updateLegend();
frameView('iso_front', camera.aspect);
$('gfilter').options[0].text = `all ${man.prints.length} print files and ${(man.plates || []).length} plates`;

document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => frameView(b.dataset.view, camera.aspect));
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { mode = r.value; applyLook(); });
$('xray').onchange = e => { xray = e.target.checked; applyLook(); };
$('extras').onchange = e => extras.forEach(o => o.visible = e.target.checked);
$('graze').onchange = e => setLights(e.target.checked);
$('tilt').oninput = e => setTilt(+e.target.value);
$('burst').onclick = () => animateTo('b', anim.bTo > 0.5 ? 0 : 1);
$('explode').oninput = e => { tween = null; anim.b = anim.bTo = +e.target.value / 100; pose(); syncUI(); };
$('nose').onclick = () => animateTo('n', anim.nTo > 0.5 ? 0 : 1);
$('service').onclick = () => animateTo('s', anim.sTo > 0.5 ? 0 : 1);
$('equip').onchange = e => { eqGroup.visible = e.target.checked; updateLegend(); };
$('cables').onchange = e => { cablesOn = e.target.checked; pose(); };
$('labels').onchange = e => { labelsOn = e.target.checked; };
$('section').onchange = e => { setSection(e.target.value); if (sectionOn) frameView('sec_' + e.target.value, camera.aspect); };
$('gallery').onclick = () => showGallery(true);
$('back').onclick = () => showGallery(false);
$('gfilter').onchange = async e => {
  galleryFilter = e.target.value;
  if (!galleryOn) await showGallery(true);
  else { layoutGallery(); frameView('gallery', camera.aspect); }
};
const ui = $('ui');
ui.querySelector('h1').onclick = () => ui.classList.toggle('min');
if (innerWidth < 700) ui.classList.add('min');
status.textContent = `${parts.length} parts loaded — drag to orbit, wheel to zoom, right-drag to pan`;
if (!capture) setTimeout(() => { status.textContent = ''; }, 8000);

function draw() {
  // Near/far follow the orbit distance so the far, narrow-angle views keep their depth precision.
  const dist = camera.position.distanceTo(controls.target);
  camera.near = Math.max(1, dist * 0.02);
  camera.far = dist * 6 + 4000;
  camera.updateProjectionMatrix();
  grid.visible = !galleryOn && camera.position.z > grid.position.z;
  renderer.render(scene, camera);
  if (capture) return;
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight, s = overlay.width / Math.max(1, w);
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (labelsOn) { octx.setTransform(s, 0, 0, s, 0, 0); drawLabels(octx, w, h); }
}
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  animate(dt); stepTween(dt); hover(now); draw();
}
requestAnimationFrame(loop);

// ---- capture mode: /viewer/?capture=1 posts PNGs to scripts/serve_viewer.py -------
if (capture) {
  ui.style.display = 'none';
  const S = (name, view, o = {}) => ({ name, view, mode: 'printed', tilt: 0, xray: false, extras: true, graze: false,
                                       burst: 0, nose: 0, service: 0, section: 'none', cables: false, labels: false,
                                       gallery: null, ...o, equip: o.equip ?? (o.extras ?? true) });
  const paint = { mode: 'paint', extras: false, graze: true };
  const shots = [
    S('01_iso_front', 'iso_front'), S('02_iso_rear', 'iso_rear'), S('03_front', 'front'), S('04_rear', 'rear'),
    S('05_left', 'left'), S('06_right', 'right'), S('07_top', 'top'), S('08_bottom', 'bottom'),
    S('09_forward_flight', 'iso_front', { tilt: 90 }),
    S('10_xray_structure', 'iso_front', { xray: true, equip: false }),
    S('11_wing_top_printed', 'wing_top', { extras: false }),
    S('12_wing_top_one_colour', 'wing_top', paint),
    S('13_wing_leading_edge_one_colour', 'wing_le', paint),
    S('14_wing_sight_down_span_one_colour', 'wing_span', paint),
    S('15_wing_underside_one_colour', 'wing_under', paint),
    S('16_wing_by_part', 'wing_le', { mode: 'parts', extras: false }),
    S('17_joint_root', 'joint_root', paint),
    S('18_joint_boom_rib', 'joint_boom', paint),
    S('19_joint_mid_tip', 'joint_midtip', paint),
    S('20_joint_tip', 'joint_tip', paint),
    S('21_joint_boom_rib_printed', 'joint_boom', { extras: false }),
    S('22_wing_top_reflection_stripes', 'wing_top', { mode: 'zebra', extras: false }),
    S('23_wing_sight_down_span_reflection_stripes', 'wing_span', { mode: 'zebra', extras: false }),
    S('24_joint_mid_tip_reflection_stripes', 'joint_midtip', { mode: 'zebra', extras: false }),
    S('25_joint_boom_rib_reflection_stripes', 'joint_boom', { mode: 'zebra', extras: false }),
    S('26_finished_one_colour', 'iso_front', { mode: 'paint' }),
    S('27_burst_view', 'burst_iso', { burst: 1, labels: true }),
    S('28_burst_view_top', 'burst_top', { burst: 1 }),
    S('29_cut_centreline', 'sec_y0', { section: 'y0', cables: true, labels: true }),
    S('30_cut_at_pixhawk', 'sec_x305', { section: 'x305', cables: true, labels: true }),
    S('31_cut_at_esc_block', 'sec_x385', { section: 'x385', cables: true, labels: true }),
    S('32_nose_open_battery_out', 'nose_open', { nose: 1, labels: true }),
    S('33_xray_equipment_and_cables', 'xray_fuse', { xray: true, cables: true, labels: true }),
    S('34_cut_wing_root_webs_and_spars', 'sec_wing', { section: 'wing', equip: false }),
    S('35_print_files_all', 'gallery', { gallery: 'all', labels: true }),
    S('36_print_files_s1_petg', 'gallery', { gallery: 's1_petg', labels: true }),
    S('37_print_files_s1_lwpla', 'gallery', { gallery: 's1_lwpla', labels: true }),
    S('38_print_files_x_lwpla', 'gallery', { gallery: 'x_lwpla', labels: true }),
    S('39_service_hatches_open_yokes_off', 'service_under', { service: 1, labels: true }),
    S('40_service_tilt_servo_and_plug_pocket', 'pod_service', { service: 1, labels: true }),
    S('41_cut_at_battery_strap', 'sec_x280', { section: 'x280', cables: true, labels: true }),
    S('42_cut_through_aileron_hatch', 'sec_hatch', { section: 'hatch', labels: true }),
    S('43_wing_tip_fairing_front', 'tip_front', paint),
    S('44_wing_tip_fairing_rear_below', 'tip_rear', paint),
    S('45_wing_tip_fairing_reflection_stripes', 'tip_front', { mode: 'zebra', extras: false }),
    S('46_vtail_tip_fairing', 'vt_tip', paint),
    S('47_print_plates_s1_petg', 'gallery', { gallery: 's1_plates', labels: true }),
  ];
  const shot = new Map();
  async function post(name, blob) {
    const res = await fetch(`/__capture__/${name}.png`, { method: 'POST', body: blob });
    await res.text();
    if (!res.ok) { document.title = `capture-error ${name}`; status.textContent = `capture failed: ${name}`; throw new Error(name); }
    status.textContent = `captured ${name}`;
  }
  async function snap(withLabels) {
    draw();
    const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
    if (!withLabels) return blob;
    const img = await createImageBitmap(blob);
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    drawLabels(g, img.width, img.height, 1.3);
    return new Promise(r => c.toBlob(r, 'image/png'));
  }
  for (const s of shots) {
    if (s.gallery) {
      galleryFilter = s.gallery;
      if (!galleryOn) await showGallery(true); else layoutGallery();
    } else if (galleryOn) await showGallery(false);
    mode = s.mode; xray = s.xray; applyLook(); setTilt(s.tilt); setLights(s.graze);
    extras.forEach(o => o.visible = s.extras);
    eqGroup.visible = s.equip; cablesOn = s.cables; labelsOn = s.labels;
    anim.b = anim.bTo = s.burst; anim.n = anim.nTo = s.nose; anim.s = anim.sTo = s.service; pose();
    setSection(s.section);
    frameView(s.view, camera.aspect);
    const blob = await snap(s.labels);
    shot.set(s.name, await createImageBitmap(blob));
    await post(s.name, blob);
  }
  // Contact sheets: every side on one page, the wing-smoothness views, and inside the airframe.
  const SHEETS = {
    '00_all_sides': [['01_iso_front', '3/4 front'], ['02_iso_rear', '3/4 rear'], ['09_forward_flight', 'forward flight, 90° tilt'],
                     ['03_front', 'front'], ['04_rear', 'rear'], ['07_top', 'top'],
                     ['05_left', 'left'], ['06_right', 'right'], ['08_bottom', 'bottom']],
    '00_wing_smoothness': [['12_wing_top_one_colour', 'wing top, one colour'], ['22_wing_top_reflection_stripes', 'wing top, reflection stripes'],
                           ['23_wing_sight_down_span_reflection_stripes', 'sighting down the span'],
                           ['17_joint_root', 'root rib joint'], ['18_joint_boom_rib', 'boom rib joint'], ['19_joint_mid_tip', 'mid/tip rib joint'],
                           ['20_joint_tip', 'tip fairing joint'], ['24_joint_mid_tip_reflection_stripes', 'mid/tip joint, stripes'],
                           ['25_joint_boom_rib_reflection_stripes', 'boom rib joint, stripes']],
    '00_inside_and_burst': [['27_burst_view', 'burst view'], ['28_burst_view_top', 'burst view from above'],
                            ['32_nose_open_battery_out', 'nose off, battery out'],
                            ['29_cut_centreline', 'cut on the centreline'], ['30_cut_at_pixhawk', 'cut at the Pixhawk (x = 305)'],
                            ['31_cut_at_esc_block', 'cut at the ESC block (x = 385)'],
                            ['33_xray_equipment_and_cables', 'x-ray: equipment and cables'],
                            ['34_cut_wing_root_webs_and_spars', 'wing root bay: webs and spars'], ['10_xray_structure', 'x-ray: PETG structure']],
    '00_servicing': [['32_nose_open_battery_out', 'nose off, battery out'], ['41_cut_at_battery_strap', 'battery strap path (x = 280)'],
                     ['42_cut_through_aileron_hatch', 'aileron servo on its hatch'],
                     ['39_service_hatches_open_yokes_off', 'servo hatches out, yokes off'],
                     ['40_service_tilt_servo_and_plug_pocket', 'tilt servo out, plug pocket']],
    '00_tips': [['43_wing_tip_fairing_front', 'wing tip fairing from the front'],
                ['44_wing_tip_fairing_rear_below', 'wing tip from behind, below'],
                ['45_wing_tip_fairing_reflection_stripes', 'wing tip, reflection stripes'],
                ['46_vtail_tip_fairing', 'V-tail tip fairing'], ['20_joint_tip', 'tip fairing joint, one colour'],
                ['07_top', 'from above']],
  };
  for (const [sheet, tiles] of Object.entries(SHEETS)) {
    const W = 640, H = 400, cols = 3;
    const c = document.createElement('canvas');
    c.width = W * cols; c.height = H * Math.ceil(tiles.length / cols);
    const g = c.getContext('2d');
    g.fillStyle = '#eef1f4'; g.fillRect(0, 0, c.width, c.height);
    g.font = '18px system-ui, sans-serif';
    tiles.forEach(([n, label], i) => {
      const x = (i % cols) * W, y = Math.floor(i / cols) * H;
      g.drawImage(shot.get(n), x, y, W, H);
      g.fillStyle = '#ffffffd9'; g.fillRect(x + 8, y + 8, g.measureText(label).width + 18, 30);
      g.fillStyle = '#222'; g.fillText(label, x + 17, y + 29);
      g.strokeStyle = '#c3c9d0'; g.strokeRect(x + 0.5, y + 0.5, W - 1, H - 1);
    });
    await post(sheet, await new Promise(r => c.toBlob(r, 'image/png')));
  }
  document.title = 'capture-done';
  status.textContent = 'capture done';
}
</script>
